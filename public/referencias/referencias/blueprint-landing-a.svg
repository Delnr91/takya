<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1 1L10 6L1 11" fill="none" stroke="#E9785A" stroke-width="2"/></marker></defs>
<rect width="1600" height="900" fill="#F7F2E8"/><rect width="1600" height="153" fill="#0D2621"/>
<text x="68" y="58" fill="#D7EE73" font-family="Arial" font-size="24" font-weight="bold">TAKYA · BLUEPRINT A</text>
<text x="68" y="116" fill="#F7F2E8" font-family="Arial" font-size="48" font-weight="bold">De una primera impresión a una conversación</text>
<text x="69" y="194" fill="#183A32" font-family="Arial" font-size="24">Experiencia pública, visual y honesta · la operación con datos reales no forma parte de esta etapa</text>
<g font-family="Arial">
<rect x="66" y="235" width="405" height="264" rx="20" fill="#183A32"/><text x="92" y="283" fill="#D7EE73" font-size="21" font-weight="bold">01 / HOME</text><text x="92" y="343" fill="#F7F2E8" font-size="38" font-weight="bold">La marca invita.</text><text x="92" y="391" fill="#F7F2E8" font-size="23">Nombre, idea y arte ambiental.</text><text x="92" y="426" fill="#F7F2E8" font-size="23">CTA: Conocer el proyecto.</text><text x="92" y="464" fill="#93AB9D" font-size="20">Foto fija si no hay video.</text>
<path d="M484 367H559" fill="none" stroke="#E9785A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="583" y="235" width="455" height="264" rx="20" fill="#FFFFFF" stroke="#93AB9D" stroke-width="3"/><text x="610" y="283" fill="#183A32" font-size="21" font-weight="bold">02 / LANDING</text><text x="610" y="343" fill="#183A32" font-size="38" font-weight="bold">La idea se explica.</text><text x="610" y="391" fill="#202724" font-size="22">Problema → propuesta → ejemplo</text><text x="610" y="423" fill="#202724" font-size="22">simulado → decisión humana</text><text x="610" y="462" fill="#183A32" font-size="20">Límites y siguiente experimento.</text>
<path d="M1050 367H1095" fill="none" stroke="#E9785A" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1117" y="235" width="415" height="264" rx="20" fill="#183A32"/><text x="1144" y="283" fill="#D7EE73" font-size="21" font-weight="bold">03 / CONTACTO</text><text x="1144" y="343" fill="#F7F2E8" font-size="38" font-weight="bold">La conversación.</text><text x="1144" y="391" fill="#F7F2E8" font-size="23">Canal y responsable por definir.</text><text x="1144" y="430" fill="#93AB9D" font-size="20">Sin formulario ficticio ni CTA roto.</text>
<rect x="66" y="555" width="695" height="188" rx="19" fill="#E8EDE6"/><text x="94" y="603" fill="#183A32" font-size="23" font-weight="bold">CAPA TÉCNICA MÍNIMA</text><text x="94" y="648" fill="#202724" font-size="22">HTML legible + imagen optimizada + CSS.</text><text x="94" y="680" fill="#202724" font-size="22">Puntos y video son mejoras opcionales.</text><text x="94" y="713" fill="#202724" font-size="22">Sin backend salvo necesidad comprobada.</text>
<rect x="818" y="555" width="714" height="188" rx="19" fill="#F4E4D9"/><text x="846" y="603" fill="#183A32" font-size="23" font-weight="bold">DECISIONES DEL EQUIPO</text><text x="846" y="648" fill="#202724" font-size="22">Audiencia, logo, mensaje, ruta y CTA.</text><text x="846" y="680" fill="#202724" font-size="22">Datos y proveedores antes de privacidad.</text><text x="846" y="713" fill="#202724" font-size="22">Revisión manual antes de escribir código.</text>
