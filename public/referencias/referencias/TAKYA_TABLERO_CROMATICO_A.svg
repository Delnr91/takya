<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TAKYA, tablero cromático propuesto para el landing A</title>
  <desc id="desc">Composición con bosque profundo, marfil mineral, grafito, salvia, coral mineral y un pequeño acento lima. Los colores se organizan como fondo, lectura, luz y señal.</desc>
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2621"/>
      <stop offset="1" stop-color="#183A32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#E9785A" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#E9785A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#F7F2E8"/>
  <rect width="900" height="900" fill="url(#forest)"/>
  <circle cx="730" cy="348" r="305" fill="url(#glow)"/>
  <g fill="none" stroke="#93AB9D" opacity="0.48" stroke-width="2">
    <path d="M -50 625 C 165 615 390 490 648 420"/>
    <path d="M -50 300 C 180 285 385 390 648 420"/>
    <path d="M 195 950 C 310 720 495 510 648 420"/>
  </g>
  <circle cx="648" cy="420" r="16" fill="#E9785A"/>
  <circle cx="648" cy="420" r="31" fill="none" stroke="#E9785A" opacity="0.65"/>
  <circle cx="508" cy="448" r="5" fill="#D7EE73"/>
  <text x="94" y="126" font-family="Arial,sans-serif" font-size="31" font-weight="700" letter-spacing="8" fill="#D7EE73">TAKYA</text>
  <text x="94" y="710" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#F7F2E8">Comprender</text>
  <text x="94" y="786" font-family="Arial,sans-serif" font-size="66" font-weight="700" fill="#F7F2E8">antes de actuar.</text>
  <text x="960" y="108" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#183A32">SISTEMA CROMÁTICO</text>
  <text x="960" y="151" font-family="Arial,sans-serif" font-size="20" fill="#202724">Propuesta para Home y landing A</text>
  <g font-family="Arial,sans-serif" fill="#202724">
    <rect x="960" y="215" width="185" height="140" rx="22" fill="#183A32"/>
    <text x="960" y="390" font-size="24" font-weight="700">Bosque profundo</text>
    <text x="960" y="422" font-size="21">#183A32</text>
    <rect x="1220" y="215" width="185" height="140" rx="22" fill="#F7F2E8" stroke="#B5B4A8"/>
    <text x="1220" y="390" font-size="24" font-weight="700">Marfil mineral</text>
    <text x="1220" y="422" font-size="21">#F7F2E8</text>
    <rect x="960" y="470" width="185" height="140" rx="22" fill="#E9785A"/>
    <text x="960" y="645" font-size="24" font-weight="700">Coral mineral</text>
    <text x="960" y="677" font-size="21">#E9785A</text>
    <rect x="1220" y="470" width="185" height="140" rx="22" fill="#D7EE73"/>
    <text x="1220" y="645" font-size="24" font-weight="700">Lima de señal</text>
    <text x="1220" y="677" font-size="21">#D7EE73</text>
  </g>
  <text x="960" y="785" font-family="Arial,sans-serif" font-size="21" fill="#202724">Lectura: grafito #202724</text>
  <text x="960" y="822" font-family="Arial,sans-serif" font-size="21" fill="#202724">Capa: salvia #93AB9D</text>
  <text x="960" y="863" font-family="Arial,sans-serif" font-size="17" fill="#5B625D">Propuesta visual · validar antes de producción</text>
</svg>
